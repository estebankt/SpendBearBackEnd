# azure-pipelines.yml
# Replaces .github/workflows/azure-deploy.yml

parameters:
  - name: deployTarget
    displayName: 'Deploy to'
    type: string
    default: 'staging'
    values:
      - staging
      - production
      - none

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  DOTNET_VERSION: '10.x'
  BUILD_CONFIGURATION: 'Release'
  PACKAGE_PATH: '$(Build.ArtifactStagingDirectory)/publish'
  STAGING_APP_NAME: 'spendbear-api-dev'
  PRODUCTION_APP_NAME: 'spendbear-api'
  AZURE_SERVICE_CONNECTION: 'azure-spendbear'

stages:

# ─────────────────────────────────────────────
- stage: Build
  displayName: 'Build & Test'
  jobs:
  - job: BuildTest
    displayName: 'Build, Test, Publish'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET $(DOTNET_VERSION)'
      inputs:
        version: $(DOTNET_VERSION)

    - task: DotNetCoreCLI@2
      displayName: 'Restore'
      inputs:
        command: restore
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Build'
      inputs:
        command: build
        arguments: '--configuration $(BUILD_CONFIGURATION) --no-restore'

    - script: |
        dotnet test \
          --configuration $(BUILD_CONFIGURATION) \
          --no-build \
          --filter "FullyQualifiedName~Domain|Application" \
          --logger trx \
          --collect:"XPlat Code Coverage" \
          --results-directory $(Agent.TempDirectory)/TestResults
      displayName: 'Unit Tests'

    - task: PublishTestResults@2
      displayName: 'Publish Test Results'
      condition: always()
      inputs:
        testResultsFormat: VSTest
        testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'

    - task: DotNetCoreCLI@2
      displayName: 'Publish API'
      inputs:
        command: publish
        publishWebProjects: false
        projects: 'src/Api/SpendBear.Api/SpendBear.Api.csproj'
        arguments: '--configuration $(BUILD_CONFIGURATION) --no-build --output $(PACKAGE_PATH)'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      displayName: 'Upload api-package artifact'
      inputs:
        PathtoPublish: '$(PACKAGE_PATH)'
        ArtifactName: 'api-package'

    - script: |
        dotnet tool install --global dotnet-ef
        export PATH="$PATH:$HOME/.dotnet/tools"
        OUT=$(Build.ArtifactStagingDirectory)/migrations
        SP=src/Api/SpendBear.Api
        mkdir -p $OUT

        dotnet ef migrations bundle \
          --project src/Modules/Identity/Identity.Infrastructure \
          --startup-project $SP --context IdentityDbContext \
          --self-contained -r linux-x64 --output $OUT/efbundle-identity --force

        dotnet ef migrations bundle \
          --project src/Modules/Spending/Spending.Infrastructure \
          --startup-project $SP --context SpendingDbContext \
          --self-contained -r linux-x64 --output $OUT/efbundle-spending --force

        dotnet ef migrations bundle \
          --project src/Modules/Budgets/Budgets.Infrastructure \
          --startup-project $SP --context BudgetsDbContext \
          --self-contained -r linux-x64 --output $OUT/efbundle-budgets --force

        dotnet ef migrations bundle \
          --project src/Modules/Notifications/Notifications.Infrastructure \
          --startup-project $SP --context NotificationsDbContext \
          --self-contained -r linux-x64 --output $OUT/efbundle-notifications --force

        dotnet ef migrations bundle \
          --project src/Modules/Analytics/Analytics.Infrastructure \
          --startup-project $SP --context AnalyticsDbContext \
          --self-contained -r linux-x64 --output $OUT/efbundle-analytics --force

        dotnet ef migrations bundle \
          --project src/Modules/StatementImport/StatementImport.Infrastructure \
          --startup-project $SP --context StatementImportDbContext \
          --self-contained -r linux-x64 --output $OUT/efbundle-statementimport --force

        cp src/Shared/SpendBear.Infrastructure.Core/Outbox/outbox-init.sql $OUT/outbox-init.sql
      displayName: 'Build migration bundles'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish migration bundles'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/migrations'
        artifactName: 'migration-bundles'

# ─────────────────────────────────────────────
- stage: Migrate
  displayName: 'Apply Database Migrations'
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      or(
        eq(variables['Build.Reason'], 'IndividualCI'),
        and(eq(variables['Build.Reason'], 'Manual'), ne('${{ parameters.deployTarget }}', 'none'))
      )
    )
  variables:
  - group: spendbear-production-vars
  jobs:
  - deployment: migrate_db
    displayName: 'Run Migration Bundles'
    environment: 'Production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: migration-bundles

          - script: |
              chmod +x $(Pipeline.Workspace)/migration-bundles/efbundle-identity
              $(Pipeline.Workspace)/migration-bundles/efbundle-identity \
                --connection "$(CONNECTIONSTRING_DEFAULTCONNECTION)"
            displayName: 'Migrate: Identity'

          - script: |
              chmod +x $(Pipeline.Workspace)/migration-bundles/efbundle-spending
              $(Pipeline.Workspace)/migration-bundles/efbundle-spending \
                --connection "$(CONNECTIONSTRING_DEFAULTCONNECTION)"
            displayName: 'Migrate: Spending'

          - script: |
              chmod +x $(Pipeline.Workspace)/migration-bundles/efbundle-budgets
              $(Pipeline.Workspace)/migration-bundles/efbundle-budgets \
                --connection "$(CONNECTIONSTRING_DEFAULTCONNECTION)"
            displayName: 'Migrate: Budgets'

          - script: |
              chmod +x $(Pipeline.Workspace)/migration-bundles/efbundle-notifications
              $(Pipeline.Workspace)/migration-bundles/efbundle-notifications \
                --connection "$(CONNECTIONSTRING_DEFAULTCONNECTION)"
            displayName: 'Migrate: Notifications'

          - script: |
              chmod +x $(Pipeline.Workspace)/migration-bundles/efbundle-analytics
              $(Pipeline.Workspace)/migration-bundles/efbundle-analytics \
                --connection "$(CONNECTIONSTRING_DEFAULTCONNECTION)"
            displayName: 'Migrate: Analytics'

          - script: |
              chmod +x $(Pipeline.Workspace)/migration-bundles/efbundle-statementimport
              $(Pipeline.Workspace)/migration-bundles/efbundle-statementimport \
                --connection "$(CONNECTIONSTRING_DEFAULTCONNECTION)"
            displayName: 'Migrate: StatementImport'

          - script: |
              psql "$(CONNECTIONSTRING_DEFAULTCONNECTION)" \
                -f $(Pipeline.Workspace)/migration-bundles/outbox-init.sql
            displayName: 'Migrate: Shared Outbox Table'

# ─────────────────────────────────────────────
- stage: DeployStaging
  displayName: 'Deploy → Staging'
  dependsOn: [Build, Migrate]
  condition: |
    and(
      succeeded(),
      eq(variables['Build.SourceBranch'], 'refs/heads/main'),
      or(
        eq(variables['Build.Reason'], 'IndividualCI'),
        and(eq(variables['Build.Reason'], 'Manual'), eq('${{ parameters.deployTarget }}', 'staging'))
      )
    )
  variables:
  - group: spendbear-staging-vars
  jobs:
  - deployment: DeployStaging
    displayName: 'Deploy to Staging App Service'
    environment: 'Staging'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to spendbear-api-dev'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              appType: webApp
              appName: $(STAGING_APP_NAME)
              package: '$(Pipeline.Workspace)/api-package/**/*.zip'

          - task: AzureAppServiceSettings@1
            displayName: 'Apply staging app settings'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              appName: $(STAGING_APP_NAME)
              appSettings: |
                [
                  {"name": "Auth0__Domain",   "value": "$(AUTH0_DOMAIN)",   "slotSetting": false},
                  {"name": "Auth0__Audience", "value": "$(AUTH0_AUDIENCE)", "slotSetting": false},
                  {"name": "ConnectionStrings__DefaultConnection", "value": "$(CONNECTIONSTRING_DEFAULTCONNECTION)", "slotSetting": false}
                ]

          - script: |
              echo "Waiting for app to start..."
              sleep 30
              for i in 1 2 3; do
                if curl -sf https://$(STAGING_APP_NAME).azurewebsites.net/health; then
                  echo "✅ Staging smoke test passed"
                  exit 0
                fi
                echo "Attempt $i failed, retrying in 10s..."
                sleep 10
              done
              echo "❌ Health check failed"
              exit 1
            displayName: 'Smoke Test'

# ─────────────────────────────────────────────
- stage: DeployProduction
  displayName: 'Deploy → Production'
  dependsOn: [DeployStaging, Migrate]
  condition: |
    and(
      succeeded(),
      eq(variables['Build.Reason'], 'Manual'),
      eq('${{ parameters.deployTarget }}', 'production')
    )
  variables:
  - group: spendbear-production-vars
  jobs:
  - deployment: DeployProduction
    displayName: 'Deploy to Production App Service'
    environment: 'Production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebApp@1
            displayName: 'Deploy to spendbear-api'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              appType: webApp
              appName: $(PRODUCTION_APP_NAME)
              package: '$(Pipeline.Workspace)/api-package/**/*.zip'

          - task: AzureAppServiceSettings@1
            displayName: 'Apply production app settings'
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              appName: $(PRODUCTION_APP_NAME)
              appSettings: |
                [
                  {"name": "Auth0__Domain",   "value": "$(AUTH0_DOMAIN)",   "slotSetting": false},
                  {"name": "Auth0__Audience", "value": "$(AUTH0_AUDIENCE)", "slotSetting": false},
                  {"name": "ConnectionStrings__DefaultConnection", "value": "$(CONNECTIONSTRING_DEFAULTCONNECTION)", "slotSetting": false}
                ]

          - script: |
              sleep 30
              for i in 1 2 3; do
                if curl -sf https://$(PRODUCTION_APP_NAME).azurewebsites.net/health; then
                  echo "✅ Production smoke test passed"
                  exit 0
                fi
                sleep 10
              done
              exit 1
            displayName: 'Smoke Test'
